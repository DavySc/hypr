# -----------------------------------------------------
# Autostart
# -----------------------------------------------------

# Session environment + polkit agent (a systemd user service on NixOS).
# Portals are dbus-activated; scripts/xdg.sh restarts them if needed.
exec-once = dbus-update-activation-environment --systemd --all && systemctl --user start polkit-gnome-authentication-agent-1.service

# Load Dunst Notification Manager
exec-once = dunst

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Initialize Wallpaper Engine
exec-once = hyprpaper

# Load waybar
exec-once = ~/.config/waybar/launch.sh

# Load nm-applet
exec-once = nm-applet

# Load bluetooth
exec-once = blueman-applet

# Load ~/.Xresources
exec-once = xrdb ~/.Xresources
